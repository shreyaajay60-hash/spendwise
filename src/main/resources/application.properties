server.port=${PORT:8080}
spring.application.name=spendwise-backend

# Persistent Relational Storage Configuration (Default: Disk-Persistent Database)
# Persists all transactions to ./data/spendwisedb so records survive Spring Boot restarts
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/spendwisedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Integration Configuration (OpenAI / Gemini LLM API)
spendwise.ai.provider=gemini
spendwise.ai.api-key=${AI_API_KEY:demo-key}
spendwise.ai.model=gemini-1.5-flash
spendwise.ai.temperature=0.1
spendwise.ai.confidence-threshold=0.85

# Logging configuration
logging.level.com.spendwise=INFO
logging.level.org.springframework.web=INFO
