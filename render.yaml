services:
  - type: web
    name: spendwise-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
    disk:
      name: spendwise-data
      mountPath: /app/data
      sizeGB: 1
